<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#155263" />
<title>SplitEase — 4 Person</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F2; --card:#FFFFFF; --ink:#2C1A08; --muted:#8A7A6D; --line:#EFE6DC;
    --teal:#155263; --gold:#FFC93C; --shadow:0 8px 24px rgba(44,26,8,0.08);
  }
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;padding-bottom:40px;}
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px;}
  h1{font-family:'Poppins',sans-serif;font-size:19px;margin:0 0 16px;color:#fff;background:var(--teal);padding:14px 16px;border-radius:14px;}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px;}
  .field{margin-bottom:12px;} label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;}
  input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;background:#FFFDFB;}
  .row2{display:flex;gap:10px;} .row2 .field{flex:1;}
  .shares-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .shares-grid .field label{font-weight:500;text-transform:none;font-size:13px;}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:15px;color:#fff;cursor:pointer;background:var(--teal);margin-top:4px;}
  .btn.gold{background:var(--gold);color:var(--teal);}
  .tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow);margin-bottom:16px;}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted);}
  .tab.active{background:var(--teal);color:#fff;}
  .balance-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .balance-row:last-child{border-bottom:none;}
  .balance-row b.pos{color:#1E7C5A;} .balance-row b.neg{color:#C94B1E;}
  .suggestion{font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line);}
  .suggestion:last-child{border-bottom:none;}
  .txn{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;justify-content:space-between;gap:10px;}
  .txn:last-child{border-bottom:none;}
  .txn-sub{color:var(--muted);font-size:12px;}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:16px 0;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--teal);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <h1>SplitEase — 4 Person</h1>

  <div class="tabs">
    <div class="tab active" data-tab="expense" id="tabExpense">+ Expense</div>
    <div class="tab" data-tab="settle" id="tabSettle">Settle up</div>
    <div class="tab" data-tab="balance" id="tabBalance">Balances</div>
  </div>

  <div class="card" id="expenseForm">
    <div class="row2">
      <div class="field"><label>Date</label><input type="date" id="expDate"></div>
      <div class="field"><label>Amount</label><input type="number" id="expAmount" step="0.01" placeholder="0.00"></div>
    </div>
    <div class="field"><label>Place / Description</label><input type="text" id="expPlace" placeholder="e.g. Dinner"></div>
    <div class="field"><label>Paid by</label><select id="expPayer"></select></div>
    <div class="field">
      <label>Shares (editable)</label>
      <div class="shares-grid" id="sharesGrid"></div>
      <div class="hint">Split is proportional to shares — 0 means that person owes nothing.</div>
    </div>
    <div class="field"><label>Notes (optional)</label><textarea id="expNote" rows="2"></textarea></div>
    <button class="btn" id="submitExpense">Save expense</button>
  </div>

  <div class="card" id="settleForm" style="display:none;">
    <div class="row2">
      <div class="field"><label>From</label><select id="setFrom"></select></div>
      <div class="field"><label>To</label><select id="setTo"></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Date</label><input type="date" id="setDate"></div>
      <div class="field"><label>Amount</label><input type="number" id="setAmount" step="0.01" placeholder="0.00"></div>
    </div>
    <div class="field"><label>Mode</label><select id="setMode"><option>Cash</option><option>Bank Transfer</option><option>Other</option></select></div>
    <div class="field"><label>Notes (optional)</label><textarea id="setNote" rows="2"></textarea></div>
    <button class="btn gold" id="submitSettle">Save settlement</button>
  </div>

  <div class="card" id="balanceCard" style="display:none;">
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Net balance per person</div>
    <div id="netList"></div>
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;">Suggested settle-ups</div>
    <div id="suggestList"></div>
  </div>

  <div class="card">
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Recent transactions</div>
    <div id="recentList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  // ⚠️ REQUIRED: paste your Apps Script /exec URL here after deploying Code.gs
  var EXEC_URL = 'PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE';

  var STATE = { people: ['Person A','Person B','Person C','Person D'], expenses: [], settlements: [], balances: { net:{}, suggestions:[] } };

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function nowTimeStr(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  function apiGet(){
    return fetch(EXEC_URL + '?action=data').then(function(r){return r.json();}).then(function(j){
      if (j.status !== 'ok') throw new Error(j.message || 'API error');
      return j.data;
    });
  }
  function apiPost(type, data){
    return fetch(EXEC_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({type:type, data:data}) })
      .then(function(r){return r.json();}).then(function(j){
        if (j.status !== 'ok') throw new Error(j.message || 'API error');
        return j.data;
      });
  }

  function switchTab(tab){
    ['expense','settle','balance'].forEach(function(t){
      document.getElementById('tab'+cap(t)).classList.toggle('active', t===tab);
    });
    document.getElementById('expenseForm').style.display = tab==='expense' ? 'block':'none';
    document.getElementById('settleForm').style.display = tab==='settle' ? 'block':'none';
    document.getElementById('balanceCard').style.display = tab==='balance' ? 'block':'none';
  }
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

  function populateSelects(){
    var payerSel = document.getElementById('expPayer');
    var fromSel = document.getElementById('setFrom');
    var toSel = document.getElementById('setTo');
    [payerSel, fromSel, toSel].forEach(function(sel){ sel.innerHTML=''; });
    STATE.people.forEach(function(p){
      [payerSel, fromSel, toSel].forEach(function(sel){
        var o = document.createElement('option'); o.value = p; o.textContent = p; sel.appendChild(o);
      });
    });
    toSel.selectedIndex = 1;

    var grid = document.getElementById('sharesGrid');
    grid.innerHTML = STATE.people.map(function(p,i){
      return '<div class="field"><label>'+p+'</label><input type="number" class="share-input" data-person="'+p+'" min="0" step="1" value="1"></div>';
    }).join('');
  }

  function init(){
    document.getElementById('expDate').value = todayStr();
    document.getElementById('setDate').value = todayStr();
    document.getElementById('tabExpense').onclick = function(){ switchTab('expense'); };
    document.getElementById('tabSettle').onclick = function(){ switchTab('settle'); };
    document.getElementById('tabBalance').onclick = function(){ switchTab('balance'); };
    document.getElementById('submitExpense').onclick = submitExpense;
    document.getElementById('submitSettle').onclick = submitSettle;
    ['expAmount','setAmount'].forEach(function(id){
      document.getElementById(id).addEventListener('focus', function(){ this.select(); });
    });

    if (!EXEC_URL || EXEC_URL.indexOf('PASTE_YOUR')===0){
      showToast('Set EXEC_URL in the code first');
      populateSelects();
      return;
    }
    apiGet().then(function(data){
      STATE = data;
      populateSelects();
      render();
    }).catch(function(err){ showToast('Error: '+err.message); populateSelects(); });
  }

  function render(){
    renderBalances();
    renderRecent();
  }

  function renderBalances(){
    var netList = document.getElementById('netList');
    netList.innerHTML = STATE.people.map(function(p){
      var v = STATE.balances.net[p] || 0;
      var cls = v > 0.01 ? 'pos' : (v < -0.01 ? 'neg' : '');
      var label = v > 0.01 ? 'is owed' : (v < -0.01 ? 'owes' : 'settled');
      return '<div class="balance-row"><span>'+p+'</span><span>'+label+' <b class="'+cls+'">'+Math.abs(v).toFixed(2)+'</b></span></div>';
    }).join('');

    var sg = document.getElementById('suggestList');
    if (!STATE.balances.suggestions.length){
      sg.innerHTML = '<div class="empty">Everyone is settled up.</div>';
    } else {
      sg.innerHTML = STATE.balances.suggestions.map(function(s){
        return '<div class="suggestion"><b>'+s.from+'</b> pays <b>'+s.to+'</b> — '+s.amount.toFixed(2)+'</div>';
      }).join('');
    }
  }

  function renderRecent(){
    var feed = [];
    STATE.expenses.forEach(function(x){
      feed.push({ sortDate: new Date(x.date+' '+(x.time||'00:00')), title: x.place, sub: x.payer+' paid · '+x.date+(x.time?' '+x.time:''), amount: x.amount });
    });
    STATE.settlements.forEach(function(s){
      feed.push({ sortDate: new Date(s.date+' '+(s.time||'00:00')), title: s.from+' → '+s.to, sub: s.mode+' · '+s.date+(s.time?' '+s.time:''), amount: s.amount });
    });
    feed.sort(function(a,b){ return b.sortDate - a.sortDate; });
    var list = document.getElementById('recentList');
    if (!feed.length){ list.innerHTML = '<div class="empty">No transactions yet.</div>'; return; }
    list.innerHTML = feed.slice(0,20).map(function(t){
      return '<div class="txn"><div><div>'+escapeHtml(t.title||'(no description)')+'</div><div class="txn-sub">'+escapeHtml(t.sub)+'</div></div><div><b>'+Number(t.amount).toFixed(2)+'</b></div></div>';
    }).join('');
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function submitExpense(){
    var amount = parseFloat(document.getElementById('expAmount').value);
    var date = document.getElementById('expDate').value;
    var place = document.getElementById('expPlace').value.trim();
    var payer = document.getElementById('expPayer').value;
    var note = document.getElementById('expNote').value.trim();
    var shares = {};
    document.querySelectorAll('.share-input').forEach(function(inp){ shares[inp.getAttribute('data-person')] = parseFloat(inp.value)||0; });
    var totalShares = Object.values(shares).reduce(function(a,b){return a+b;},0);

    if (!amount || amount<=0){ showToast('Enter a valid amount'); return; }
    if (!date){ showToast('Pick a date'); return; }
    if (totalShares<=0){ showToast('Shares must add up to more than 0'); return; }

    var btn = document.getElementById('submitExpense');
    btn.disabled = true; btn.textContent = 'Saving…';
    apiPost('expense', { date:date, time:nowTimeStr(), place:place, amount:amount, payer:payer, shares:shares, note:note })
      .then(function(data){
        STATE = data; render();
        document.getElementById('expAmount').value=''; document.getElementById('expPlace').value=''; document.getElementById('expNote').value='';
        btn.disabled=false; btn.textContent='Save expense'; showToast('Expense saved');
      }).catch(function(err){ btn.disabled=false; btn.textContent='Save expense'; showToast('Error: '+err.message); });
  }

  function submitSettle(){
    var from = document.getElementById('setFrom').value;
    var to = document.getElementById('setTo').value;
    var amount = parseFloat(document.getElementById('setAmount').value);
    var date = document.getElementById('setDate').value;
    var mode = document.getElementById('setMode').value;
    var note = document.getElementById('setNote').value.trim();

    if (from === to){ showToast('From and To must differ'); return; }
    if (!amount || amount<=0){ showToast('Enter a valid amount'); return; }
    if (!date){ showToast('Pick a date'); return; }

    var btn = document.getElementById('submitSettle');
    btn.disabled = true; btn.textContent = 'Saving…';
    apiPost('settlement', { date:date, time:nowTimeStr(), from:from, to:to, amount:amount, mode:mode, note:note })
      .then(function(data){
        STATE = data; render();
        document.getElementById('setAmount').value=''; document.getElementById('setNote').value='';
        btn.disabled=false; btn.textContent='Save settlement'; showToast('Settlement saved');
      }).catch(function(err){ btn.disabled=false; btn.textContent='Save settlement'; showToast('Error: '+err.message); });
  }

  var toastTimer;
  function showToast(msg){
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  init();
</script>
</body>
</html>
